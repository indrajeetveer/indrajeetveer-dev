<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashbord</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
      <div class="main">
        <section class="allElems">
            <div class="todo elem" id="0">
                <img src="https://plus.unsplash.com/premium_photo-1681487870238-4a2dfddc6bcb?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8dG8tZG8lMjBsaXN0fGVufDB8fDB8fHww" alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://plus.unsplash.com/premium_photo-1706544427100-821782654c26?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTN8fGJlc3QlMjBiZyUyMGltZ0RhaWx5JTIwUGxhbm5lcnxlbnwwfHwwfHx8MA%3D%3D" alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://images.unsplash.com/photo-1515191107209-c28698631303?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8TW90aXZhdGlvbiUyMGJnfGVufDB8fDB8fHww" alt="">
                <h2>Motivation</h2>
            </div>
             <div class="pomo elem" id="3">
                <img src="https://images.unsplash.com/photo-1508962914676-134849a727f0?w=1000&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHBvbW9kb3JvfGVufDB8fDB8fHww" alt="">
                <h2>Promodoro Timmer</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://media.istockphoto.com/id/624444310/photo/goals-concept-word-with-alphabet-pasta-letters.webp?a=1&b=1&s=612x612&w=0&k=20&c=U1Wmx1p42tjmAhL3ojT001TGvIuF5DSQWDZ5TVuxrw8=" alt="">
            <h2>Daily Goles</h2>  
            </div>
        </section>

        <section class="fullElem todo-list-fullpage">
            <button class="back" id="0">Close</i></i></button>
            <h1>Todo page</h1>
            <info>
              <div class="sub-main">
              <div class="input">
              <input type="text">
              <button id="btn1">Add the Task</button>
          </div>
          <div id="result">
             
          </div>
          </div>
     </info>
        </section>

         <section class="fullElem daily-planner-fullpage">
            <button class="back" id="1">Close</button>
            <h1>Daily Planner</h1>
        </section>

         <section class="fullElem motivational-fullpage">
            <button class="back" id="2">Close</button>
            <h1>Motivation Quote</h1>
            <div class="message">
                <p class="heading"></p>
            </div>
        </section>

         <section class="fullElem pomodoro-fullpage">
            <button class="back" id="3">Close</button>
            <h1>Promodoro Timer</h1>
        </section>

         <section class="fullElem daily-goles-fullpage">
            <button class="back" id="4">Close</button>
            <h1>Daily Goals</h1>
        </section>
      </div>

    <script src="./script.js"></script>
</body>
</html>
