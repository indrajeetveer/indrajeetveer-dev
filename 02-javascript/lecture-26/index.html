<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#74ebd5,#ACB6E5);
        }

        .container{
            width:400px;
            background:#fff;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin:15px 0;
            font-size:18px;
            border:2px solid #ccc;
            border-radius:8px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border-color:#4CAF50;
            box-shadow:0 0 8px rgba(76,175,80,0.4);
        }

        button{
            width:100%;
            padding:12px;
            font-size:18px;
            border:none;
            border-radius:8px;
            background:#4CAF50;
            color:white;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#388E3C;
            transform:scale(1.03);
        }

        h1{
            margin-top:20px;
            color:#2196F3;
            font-size:30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌍 Weather App</h2>

        <label>Enter a city name</label>

        <input type="text" placeholder="e.g. Mumbai">

        <button>Search</button>

        <h1>......</h1>
    </div>

    <script src="./script.js"></script>

</body>
</html>
